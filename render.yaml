# Render.com Blueprint — NEON STRIKE onlayn server (bepul reja).
# Render: New → Blueprint → shu repo. WebSocket qo'llanadi; https → wss avtomatik.
services:
  - type: web
    name: neonstrike
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "22"
