<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model V-773 — inspection</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b1c; color: #cfe6ff; font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .bar { position: fixed; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 24px); }
  .bar button { background: rgba(20,40,90,.7); color: #cfe6ff; border: 1px solid #2f6fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .bar button.on { background: #2f6fff; color: #fff; }
  h1 { position: fixed; left: 0; right: 0; top: 52px; margin: 0; text-align: center; font: 700 22px system-ui; letter-spacing: .06em; color: #7fe3ff; text-shadow: 0 0 12px #2f8cff; pointer-events: none; }
  .labels { position: fixed; left: 0; right: 0; bottom: 4%; display: flex; justify-content: space-around; font: 700 18px system-ui; color: #9fdcff; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<h1>CHARACTER SPECIFICATION: MODEL V-773</h1>
<div class="bar" id="bar"></div>
<div class="labels" id="labels"><span>FRONT</span><span>LEFT SIDE</span><span>BACK</span><span>RIGHT SIDE</span></div>
<script type="module" src="/js/v/viewer.js"></script>
</body>
</html>
